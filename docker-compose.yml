services:
  # 1. PostgreSQL Ma'lumotlar Bazasi
  postgres:
    image: postgres:16-alpine
    container_name: sales_intelligence_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Sales_Intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Sales_Intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sales_network

  # 2. Backend Web API (.NET 10)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_intelligence_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PostgreSql=Host=postgres;Port=5432;Database=${POSTGRES_DB:-Sales_Intelligence};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-1234}
      - Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-karoc771@gmail.com}
      - Smtp__Password=${SMTP_PASSWORD:-okyv lorb nmxe ecqg}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL:-karoc771@gmail.com}
      - Smtp__FromName=${SMTP_FROM_NAME:-Sales Intelligence Xavfsizlik}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
    ports:
      - "${BACKEND_PORT:-5156}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/swagger/index.html || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sales_network

  # 3. Frontend (React 19 + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales_intelligence_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sales_network

volumes:
  postgres_data:
    driver: local

networks:
  sales_network:
    driver: bridge
